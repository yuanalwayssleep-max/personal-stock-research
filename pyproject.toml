[project]
name = "personal-stock-research"
version = "0.1.0"
description = "A-share quantitative research system with FastAPI backend, React frontend, DuckDB storage, and ML-ready architecture."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
